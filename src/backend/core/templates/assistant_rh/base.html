<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Conversations — Assistant RH{% endblock %}</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f6f6f6; color: #161616; margin: 0; }
      main { max-width: 28rem; margin: 8vh auto; padding: 2rem; background: white; }
      label, input { display: block; }
      input { box-sizing: border-box; width: 100%; padding: .75rem; margin-top: .5rem; font: inherit; }
      button { background: #000091; color: white; border: 0; padding: .75rem 1.25rem; font: inherit; cursor: pointer; }
      .errorlist { color: #b34000; }
      a { color: #000091; }
      .button-secondary { display: inline-block; border: 1px solid #000091; padding: .75rem 1.25rem; text-decoration: none; }
    </style>
  </head>
  <body><main>{% block content %}{% endblock %}</main></body>
</html>
