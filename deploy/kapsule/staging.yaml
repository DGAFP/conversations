# Configuration non secrète du nouveau staging Kapsule.
fullnameOverride: conversations
image:
  repository: rg.fr-par.scw.cloud/assistant-rh-staging/conversations-backend
  credentials:
    name: scw-registry
backend:
  replicas: 2
  envFrom:
    - secretRef: {name: conversations-runtime}
  envVars:
    DJANGO_CONFIGURATION: Production
    DJANGO_SETTINGS_MODULE: conversations.settings
    DB_HOST: "10.10.1.2"
    DB_PORT: "5432"
    DB_NAME: conversations
    DB_USER: conversations_app
    ASSISTANT_RH_ENABLED: "true"
    ASSISTANT_RH_LOCAL_LOGIN_ENABLED: "true"
    ASSISTANT_RH_API_URL: http://assistant-rh-api.assistant-rh-api.svc.cluster.local:8000/v1
    ASSISTANT_RH_DELEGATION_ISSUER: urn:assistant-rh:conversations:staging
    ASSISTANT_RH_API_AUDIENCE: assistant-rh-api
    ASSISTANT_RH_SIGNING_KID: staging-2026-10
    ASSISTANT_RH_SIGNING_KEY_FILE: /etc/conversations-identity/signing.pem
    ASSISTANT_RH_AUDIT_KEY_FILE: /etc/conversations-identity/audit.key
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,conversations-backend,conversations-backend.conversations.svc.cluster.local
    ENVIRONMENT: staging
    PGCONNECT_TIMEOUT: "5"
    PGSSLMODE: verify-ca
    PGSSLROOTCERT: /etc/scaleway-ca/postgres.pem
    LLM_DEFAULT_MODEL_HRID: assistant-rh-matte
    LLM_CONFIGURATION_FILE_PATH: /etc/conversations-llm/config.json
  extraVolumes:
    - name: identity
      secret: {secretName: conversations-identity}
    - name: scaleway-ca
      secret: {secretName: scaleway-database-ca}
    - name: llm-config
      configMap: {name: conversations-llm-configuration}
  extraVolumeMounts:
    - {name: identity, mountPath: /etc/conversations-identity, readOnly: true}
    - {name: scaleway-ca, mountPath: /etc/scaleway-ca, readOnly: true}
    - {name: llm-config, mountPath: /etc/conversations-llm, readOnly: true}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  migrateJobAnnotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  jobs:
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 600
    backoffLimit: 1
  migrate:
    command: [python, manage.py, migrate, --no-input]
  createsuperuser:
    enabled: false
frontend:
  replicas: 2
  image:
    repository: rg.fr-par.scw.cloud/assistant-rh-staging/conversations-frontend
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
ingress:
  enabled: false
  className: traefik
  host: ""
ingressAdmin:
  enabled: false
ingressMedia:
  enabled: false
